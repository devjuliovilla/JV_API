name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WebApi.slnx

      - name: Build
        run: dotnet build WebApi.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Tests/Tests.csproj --no-build --configuration Release
